# Dependency vulnerability scanning against the official Go vulnerability DB.
# Action versions verified 2026-08-12: golang/govulncheck-action@v1.
name: Vuln

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
