name: Release

# Runs on every pushed version tag (v*). It:
#   1. Runs the full verification gate (go test -race, go vet).
#   2. Builds all supported platform binaries with GoReleaser (ldflags inject
#      version, commit, build date, platform).
#   3. Generates checksums.txt and creates the GitHub Release with all
#      binaries + checksums attached.
# The workflow fails if tests or static checks fail — no release is published
# on a failing gate.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    name: test + vet gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: test (race)
        run: go test -count=1 -race -short ./...
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: build CLI
        run: go build -o riskx ./cmd/riskx

  release:
    name: build + publish release
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
