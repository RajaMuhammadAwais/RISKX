# Staticcheck: static type/lint analysis. Action versions verified 2026-08-12:
# dominikh/staticcheck-action@v1.
name: Staticcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
