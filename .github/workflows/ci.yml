# CI: build, test (race detector), vet, and module hygiene on every push and PR.
# Action versions verified 2026-08-12: actions/setup-go@v7.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (race) — ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.25"]
        include:
          - os: macos-latest
            go-version: "1.25"
          - os: windows-latest
            go-version: "1.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        # Short mode skips long-running live-feed network tests in CI; the
        # equivalent offline coverage is preserved via recorded fixtures.
        run: go test -count=1 -race -short ./...
      - name: Build CLI
        run: go build -o riskx ./cmd/riskx

  mod-tidy:
    name: go mod tidy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: go mod tidy -diff
        run: go mod tidy -diff

  govulncheck-local:
    name: govulncheck (local baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
